[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-recovery"
version = "0.2.0"
description = "Diagnostic-first Ethernet recovery tooling for supported DGX Spark OEM images"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-MKD-Personal-Use"
dependencies = ["pycdlib>=1.14,<2", "zstandard>=0.23,<1"]

[project.urls]
Homepage = "https://github.com/mkd-hossain/nvidia-dgx-spark-factory-reset"
Issues = "https://github.com/mkd-hossain/nvidia-dgx-spark-factory-reset/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.14,<1"]
desktop = ["PySide6-Essentials>=6.8,<7"]
bundle = ["pyinstaller>=6.16,<7"]

[project.scripts]
spark-recovery = "spark_recovery.cli:main"
spark-recovery-desktop = "spark_recovery.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S603", "S607", "S311"]

