name: Desktop builds
on:
  push:
    tags: ['v0.2.*', 'v0.3.*']
  pull_request:
    paths: ['src/**', 'packaging/**', 'desktop_entry.py', 'pyproject.toml', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Statically link Intel Mac SSH cryptography
        if: matrix.label == 'macOS-x64'
        shell: bash
        run: |
          openssl_prefix="$(brew --prefix openssl@3)"
          test -f "$openssl_prefix/lib/libssl.a"
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "PIP_NO_BINARY=cryptography" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=true" >> "$GITHUB_ENV"
      - run: python -m pip install -c packaging/requirements-build.txt -e ".[desktop,bundle,test]"
      - name: Application version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          value = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('SPARK_APP_VERSION=' + value + '\n')
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/make_icons.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean packaging/desktop.spec
      - name: Smoke test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $task = Start-Process -FilePath '.\dist\MKD-Spark-Recovery\MKD-Spark-Recovery.exe' -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw "Desktop smoke test failed: $($task.ExitCode)" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler "/DAppVersion=$env:SPARK_APP_VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test Windows install, launch and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'MKD-Recovery-Installer-Test'
          $installer = (Get-ChildItem -LiteralPath dist/installers -Filter '*Setup.exe').FullName
          $task = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$destination`"") -Wait -PassThru -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw "Installation failed: $($task.ExitCode)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $task = Start-Process -FilePath (Join-Path $destination 'MKD-Spark-Recovery.exe') -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw "Installed app failed: $($task.ExitCode)" }
          $task = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw "Uninstallation failed: $($task.ExitCode)" }
      - name: Smoke test and package macOS application
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/MKD Spark Recovery.app/Contents/MacOS/MKD-Spark-Recovery" --smoke-test
          mkdir -p dist/installers dmg-content
          cp -R "dist/MKD Spark Recovery.app" dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "MKD Spark Recovery" -srcfolder dmg-content -ov -format UDZO "dist/installers/MKD-Spark-Recovery-${SPARK_APP_VERSION}-${{ matrix.label }}.dmg"
          hdiutil verify "dist/installers/MKD-Spark-Recovery-${SPARK_APP_VERSION}-${{ matrix.label }}.dmg"
      - name: Checksums
        shell: python
        run: |
          import hashlib, pathlib
          folder = pathlib.Path('dist/installers')
          paths = sorted(p for p in folder.iterdir() if p.is_file())
          assert paths, 'No installer built'
          (folder / 'SHA256SUMS-${{ matrix.label }}.txt').write_text(''.join(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n' for p in paths), encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.label }}
          path: dist/installers/*
          retention-days: 14
