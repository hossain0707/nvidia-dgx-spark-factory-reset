name: Desktop builds
on:
  push:
    tags: ['v0.2.*']
  pull_request:
    paths: ['src/**', 'packaging/**', 'desktop_entry.py', 'pyproject.toml', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c packaging/requirements-build.txt -e ".[desktop,bundle,test]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/make_icons.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean packaging/desktop.spec
      - name: Smoke test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $task = Start-Process -FilePath '.\dist\MKD-Spark-Recovery\MKD-Spark-Recovery.exe' -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw "Desktop smoke test failed: $($task.ExitCode)" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Smoke test and package macOS application
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/MKD Spark Recovery.app/Contents/MacOS/MKD-Spark-Recovery" --smoke-test
          mkdir -p dist/installers dmg-content
          cp -R "dist/MKD Spark Recovery.app" dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "MKD Spark Recovery" -srcfolder dmg-content -ov -format UDZO "dist/installers/MKD-Spark-Recovery-0.2.0-${{ matrix.label }}.dmg"
      - name: Checksums
        shell: python
        run: |
          import hashlib, pathlib
          folder = pathlib.Path('dist/installers')
          paths = sorted(p for p in folder.iterdir() if p.is_file())
          assert paths, 'No installer built'
          (folder / 'SHA256SUMS-${{ matrix.label }}.txt').write_text(''.join(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n' for p in paths), encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.label }}
          path: dist/installers/*
          retention-days: 14
