<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="266" viewBox="0 0 1120 266" role="img" aria-labelledby="title desc">
<title id="title">Understand each consent before approving</title><desc id="desc">Network approval temporarily changes the host recovery link. Reboot approval interrupts target workloads but does not authorize erase. SSD approval permanently removes target data and still requires final console confirmation.</desc>
<rect width="1120" height="266" rx="20" fill="#0c1828"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="40" fill="#f1f7ff" font-size="23" font-weight="700">THREE DIFFERENT APPROVALS</text>
<g fill="#14283b" stroke="#36556c"><rect x="28" y="66" width="344" height="174" rx="10"/><rect x="388" y="66" width="344" height="174" rx="10"/><rect x="748" y="66" width="344" height="174" rx="10" stroke="#ee927e"/></g>
<g font-size="18" font-weight="700"><text x="48" y="101" fill="#4de4cc">NETWORK SETUP</text><text x="408" y="101" fill="#ffd18a">DIAGNOSTIC REBOOT</text><text x="768" y="101" fill="#ffac97">PERMANENT SSD ERASE</text></g>
<g fill="#c2d2e1" font-size="15"><text x="48" y="134">Temporary host address + services.</text><text x="48" y="160">ICS may be interrupted on Windows.</text><text x="48" y="186">Review the interface and plan.</text><text x="48" y="215">Restore the host after recovery.</text><text x="408" y="134">Stops running target workloads.</text><text x="408" y="160">Save work before approving.</text><text x="408" y="186">Boots a diagnostic environment.</text><text x="408" y="215">This does not authorize erasure.</text><text x="768" y="134">Files, accounts and settings lost.</text><text x="768" y="160">Check the exact SSD serial.</text><text x="768" y="186">Have backups before consenting.</text><text x="768" y="215">Final console approval still needed.</text></g></g></svg>
