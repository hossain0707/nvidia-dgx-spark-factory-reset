<style>.flow{stroke-dasharray:10 12;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style>
</defs>
